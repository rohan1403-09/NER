<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Sense</title>
</head>
<body>

    <main>
        <h1>Welcome to Trail Sense</h1>
        <h1><b>STAY AWARE,</b></h1>
        <h1><b>STAY PREPARED...</b></h1>

        <p><i><b>An AI-Based early warning system for Landslides and Road Blockages.</b></i></p>

       <section class="Sign in">
    <form action="otp.html" method="get">

        <div class="form">
            <h2>Sign in</h2>

            <input type="email" placeholder="Email" required>

            <input type="password" placeholder="Password" required>

            <div class="phone-number">
                <h2>Enter a 10 digit valid phone number</h2>
                <input type="tel"
                placeholder="Phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required>
            </div>
            <div class="Location">
            <h2>Enter your location</h2>
            <input type="text" placeholder="Location" required>
            </div>
            <div class="submit">
            <button type="submit">Submit</button>
            </div>

        </div>

    </form>
</section>
    </main>

</body>
</html>
